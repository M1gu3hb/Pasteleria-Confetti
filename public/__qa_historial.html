:root {
  --font-heading: 'Playfair Display', serif;
  --font-body: 'Plus Jakarta Sans', sans-serif;
  /* Pastelería Confetti — Crema / Rosa / Café */
  --background: 22 100% 97%;
  /* #FFF8F4 crema */
  --foreground: 28 54% 12%;
  /* café texto */
  --card: 0 0% 100%;
  --card-foreground: 28 54% 12%;
  --popover: 0 0% 100%;
  --popover-foreground: 28 54% 12%;
  --primary: 333 75% 63%;
  /* #E8579A rosa principal */
  --primary-foreground: 0 0% 100%;
  --secondary: 18 43% 89%;
  /* #F0DDD5 beige */
  --secondary-foreground: 18 51% 24%;
  /* #5C2D1E café */
  --muted: 24 80% 95%;
  /* crema medio */
  --muted-foreground: 14 21% 40%;
  /* café claro */
  --accent: 18 51% 24%;
  /* #5C2D1E café */
  --accent-foreground: 0 0% 100%;
  --destructive: 0 72% 51%;
  --destructive-foreground: 0 0% 100%;
  --border: 18 43% 89%;
  /* #F0DDD5 */
  --input: 18 43% 89%;
  --ring: 333 75% 63%;
  /* rosa focus */
  --radius: 0.75rem;
  --success: 152 60% 40%;
  --success-foreground: 0 0% 100%;
  --warning: 38 92% 50%;
  --warning-foreground: 222 47% 11%;
  --info: 199 89% 48%;
  --info-foreground: 0 0% 100%;
  --chart-1: 217 91% 55%;
  --chart-2: 199 89% 48%;
  --chart-3: 152 60% 40%;
  --chart-4: 38 92% 50%;
  --chart-5: 280 60% 55%;
  /* Sidebar — café profundo Confetti con acento rosa */
  --sidebar-background: 18 51% 24%;
  /* #5C2D1E café */
  --sidebar-foreground: 22 100% 97%;
  /* crema texto */
  --sidebar-primary: 333 75% 63%;
  /* rosa activos */
  --sidebar-primary-foreground: 0 0% 100%;
  --sidebar-accent: 18 57% 18%;
  /* café hover */
  --sidebar-accent-foreground: 22 100% 97%;
  --sidebar-border: 18 57% 18%;
  --sidebar-ring: 333 75% 63%;
}

.dark {
  --background: 24 58% 7%;
  /* café muy oscuro */
  --foreground: 22 100% 97%;
  --card: 28 54% 12%;
  /* #2E1D0E */
  --card-foreground: 22 100% 97%;
  --popover: 28 54% 12%;
  --popover-foreground: 22 100% 97%;
  --primary: 333 75% 63%;
  /* rosa */
  --primary-foreground: 0 0% 100%;
  --secondary: 18 57% 18%;
  --secondary-foreground: 22 100% 97%;
  --muted: 24 62% 13%;

  --accent: 330 79% 80%;

  --accent-foreground: 28 54% 12%;
  --destructive: 0 72% 45%;
  --destructive-foreground: 0 0% 100%;
  --border: 18 57% 18%;
  --input: 18 57% 18%;
  --ring: 333 75% 63%;
  --sidebar-background: 24 67% 5%;
  --sidebar-foreground: 22 100% 97%;
  --sidebar-primary: 333 75% 63%;
  --sidebar-primary-foreground: 0 0% 100%;
  --sidebar-accent: 28 54% 12%;
  --sidebar-accent-foreground: 22 100% 97%;
  --sidebar-border: 28 54% 12%;
  --sidebar-ring: 333 75% 63%;
}

*{
  border-color: hsl(var(--border));
  outline-color: hsl(var(--ring) / 0.5);
}

html, body, #root {
  /* Evita bordes/zonas blancas inferiores y laterales cuando el contenido
       es más corto que el viewport o cuando hay overscroll en móvil iOS. */

  background-color: hsl(var(--background));

  transition-duration: 150ms;
}

.transition-colors{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-opacity{
  transition-property: opacity;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-shadow{
  transition-property: box-shadow;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-transform{
  transition-property: transform;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.duration-1000{
  transition-duration: 1000ms;
}

.duration-200{
  transition-duration: 200ms;
}

.duration-300{
  transition-duration: 300ms;
}

.ease-in-out{
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

.ease-linear{
  transition-timing-function: linear;
}

@keyframes enter{
  from{
    opacity: var(--tw-enter-opacity, 1);
    transform: translate3d(var(--tw-enter-translate-x, 0), var(--tw-enter-translate-y, 0), 0) scale3d(var(--tw-enter-scale, 1), var(--tw-enter-scale, 1), var(--tw-enter-scale, 1)) rotate(var(--tw-enter-rotate, 0));
  }
}

@keyframes exit{
  to{
    opacity: var(--tw-exit-opacity, 1);
    transform: translate3d(var(--tw-exit-translate-x, 0), var(--tw-exit-translate-y, 0), 0) scale3d(var(--tw-exit-scale, 1), var(--tw-exit-scale, 1), var(--tw-exit-scale, 1)) rotate(var(--tw-exit-rotate, 0));
  }
}

.animate-in{
  animation-name: enter;
  animation-duration: 150ms;
  --tw-enter-opacity: initial;
  --tw-enter-scale: initial;
  --tw-enter-rotate: initial;
  --tw-enter-translate-x: initial;
  --tw-enter-translate-y: initial;
}

.fade-in-0{
  --tw-enter-opacity: 0;
}

.zoom-in-95{
  --tw-enter-scale: .95;
}

.zoom-out{
  --tw-exit-scale: 0;
}

.duration-1000{
  animation-duration: 1000ms;
}

.duration-200{
  animation-duration: 200ms;
}

.duration-300{
  animation-duration: 300ms;
}

.ease-in-out{
  animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

.ease-linear{
  animation-timing-function: linear;
}

.running{

}

/* =====================================================
   MODO OSCURO — Animación al alternar tema
   =====================================================
   La clase `.theme-anim` se aplica al <html> SOLO durante ~600ms
   cuando el usuario cambia tema. Esto permite que el navegador
   anime fondo/color/borde sin penalizar el resto del tiempo. */

html.theme-anim,
html.theme-anim body,
html.theme-anim *:not(input):not(textarea):not(select):not(svg):not(svg *) {
  transition: background-color 480ms cubic-bezier(0.4, 0, 0.2, 1),
              background-image 480ms cubic-bezier(0.4, 0, 0.2, 1),
              color 480ms cubic-bezier(0.4, 0, 0.2, 1),
              border-color 480ms cubic-bezier(0.4, 0, 0.2, 1),
              box-shadow 480ms cubic-bezier(0.4, 0, 0.2, 1),
              fill 480ms cubic-bezier(0.4, 0, 0.2, 1),
              stroke 480ms cubic-bezier(0.4, 0, 0.2, 1) !important;
}

/* En modo oscuro, los logos PNG con fondo blanco/transparente claro
   pueden “desaparecer”. Aplicamos un sutil tratamiento al logo de
   marca de agua para que siga visible y elegante. */

html.dark .brand-watermark {
  filter: grayscale(20%) brightness(1.6) contrast(0.9);
}

/* =====================================================
   REFLEJO PREMIUM — superficie con brillo sutil arriba
   =====================================================
   Aplica con className="premium-sheen" a cards/paneles/cuadritos
   donde quieras el efecto 3D elegante (Recetas-like).
   Más sutil en dark, claro y elegante en light. */

.premium-sheen {
  position: relative;
  isolation: isolate;
}

.premium-sheen::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0.55) 0%,
    rgba(255, 255, 255, 0.18) 6%,
    rgba(255, 255, 255, 0)   24%,
    rgba(255, 255, 255, 0)   100%
  );
  mix-blend-mode: overlay;
  opacity: 0.85;
  z-index: 1;
}

html.dark .premium-sheen::before {
  background: linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0.10) 0%,
    rgba(255, 255, 255, 0.05) 8%,
    rgba(255, 255, 255, 0)    28%,
    rgba(255, 255, 255, 0)    100%
  );
  opacity: 0.9;
}

/* Asegurar que el contenido quede arriba del reflejo */

.premium-sheen > * {
  position: relative;
  z-index: 2;
}

/* =====================================================
   DOCUMENTOS IMPRIMIBLES — SIEMPRE BLANCOS Y LEGIBLES
   =====================================================

   de producto. Sin importar si el sistema está en dark mode, estos
   documentos DEBEN salir con fondo blanco y texto negro/gris oscuro.
   Esta capa anula cualquier override de dark mode dentro de estos
   contenedores y también aplica en @media print.

   Clases protegidas: .ticket-printable .cash-cut-pdf .pdf-corte-caja .printable-doc
   No cambia lógica funcional. Solo asegura legibilidad de impresión. */

/* 1) Contenedores raíz — fondo blanco fijo, texto oscuro */

.ticket-printable,
.cash-cut-pdf,
.pdf-corte-caja,
.printable-doc,
html.dark .ticket-printable,
html.dark .cash-cut-pdf,
html.dark .pdf-corte-caja,
html.dark .printable-doc {
  background-color: #ffffff !important;
  color: #111827 !important;
  color-scheme: light !important;
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
}

/* 2) Todo el árbol — texto oscuro legible y sin fondos oscuros */

.ticket-printable *,
.cash-cut-pdf *,
.pdf-corte-caja *,
.printable-doc *,
html.dark .ticket-printable *,
html.dark .cash-cut-pdf *,
html.dark .pdf-corte-caja *,
html.dark .printable-doc * {
  color: #111827 !important;
  border-color: #d1d5db;
}

/* 3) Anular cualquier clase de "texto claro" usada para dark mode */

.ticket-printable .text-white,
.ticket-printable .text-slate-50,
.ticket-printable .text-slate-100,
.ticket-printable .text-slate-200,
.ticket-printable .text-gray-50,
.ticket-printable .text-gray-100,
.ticket-printable .text-gray-200,

.ticket-printable .text-zinc-100,
.ticket-printable .text-neutral-50,
.ticket-printable .text-neutral-100,
.cash-cut-pdf .text-white,
.cash-cut-pdf .text-slate-50,
.cash-cut-pdf .text-slate-100,
.cash-cut-pdf .text-slate-200,
.cash-cut-pdf .text-gray-50,
.cash-cut-pdf .text-gray-100,
.cash-cut-pdf .text-gray-200,
.pdf-corte-caja .text-white,
.pdf-corte-caja .text-slate-50,
.pdf-corte-caja .text-slate-100,
.pdf-corte-caja .text-slate-200,
.pdf-corte-caja .text-gray-50,
.pdf-corte-caja .text-gray-100,
.pdf-corte-caja .text-gray-200,
.printable-doc .text-white,
.printable-doc .text-slate-50,
.printable-doc .text-slate-100,

/* =====================================================
   IMPRESIÓN — Reglas globales
   Modo "thermal" (80mm) y modo "letter" (carta) son
   mutuamente excluyentes a nivel de @page.
   El JS añade <html data-print-mode="thermal|letter">
   antes de window.print() para activar el correcto.
   ===================================================== */

@media print {
  /* Ocultar todo por defecto */

  body * {
    visibility: hidden;
  }

  /* Solo el contenedor imprimible es visible */

  .ticket-printable, .ticket-printable * {
    visibility: visible;
  }

  .cash-cut-pdf, .cash-cut-pdf * {
    visibility: visible;
  }

  .ticket-printable, .cash-cut-pdf {
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    background: white !important;
    color: black !important;
    box-shadow: none !important;
    margin: 0 !important;
  }

  /* Nunca imprimir UI/chrome del navegador */

  .no-print, .no-print * {
    display: none !important;
    visibility: hidden !important;
  }

  /* Evitar que iframes o stickys impriman fondos */

  body {
    background: white !important;
  }
}

/* ----- Térmico 58/80mm DESACTIVADO -----
   Cancelamos el modo térmico para tickets: ahora se imprimen siempre como
   carta vía iframe oculto desde lib/print.js (printTicketViaIframe).
   El iframe inyecta su propio CSS @page letter y solo imprime el ticket,
   nunca el POS completo.
   Este bloque queda como fallback visual mínimo si por error alguien
   marcara data-print-mode="thermal" en la página completa. */

@media print {
  html[data-print-mode="thermal"] .ticket-printable {
    width: 100% !important;
    max-width: 720px !important;
    margin: 0 auto !important;
    padding: 16px 20px !important;
    color: #000 !important;
    background: #fff !important;
  }

  html[data-print-mode="thermal"] .ticket-printable img {
    max-width: 160px !important;
    max-height: 80px !important;
    width: auto !important;
    height: auto !important;
    -o-object-fit: contain !important;
       object-fit: contain !important;
    display: block !important;
    margin: 0 auto 8px !important;
    page-break-inside: avoid !important;
  }
}

/* ----- Documento A4/carta ----- */

@media print {
  html[data-print-mode="letter"] body {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  html[data-print-mode="letter"] .cash-cut-pdf,
  html[data-print-mode="letter"] .ticket-printable.letter-doc,
  html[data-print-mode="letter"] .pdf-corte-caja {

    max-width: 100% !important;
    padding: 8mm !important;
    margin: 0 !important;
    box-sizing: border-box !important;
    transform: none !important;
    overflow: visible !important;
    height: auto !important;
    max-height: none !important;
    position: static !important;
  }

  html[data-print-mode="letter"] table {
    page-break-inside: auto;
    width: 100% !important;
    border-collapse: collapse !important;
  }

  html[data-print-mode="letter"] tr {
    page-break-inside: avoid;
    page-break-after: auto;
  }

  html[data-print-mode="letter"] thead {
    display: table-header-group;
  }

  html[data-print-mode="letter"] tfoot {
    display: table-footer-group;
  }

  html[data-print-mode="letter"] .avoid-break,
  html[data-print-mode="letter"] h1,
  html[data-print-mode="letter"] h2,
  html[data-print-mode="letter"] h3 {
    page-break-inside: avoid;
    page-break-after: avoid;
  }

  html[data-print-mode="letter"] .page-break {

  }

  /* Asegurar que el contenedor padre no recorte */

  html[data-print-mode="letter"] [role="dialog"],

    overflow: visible !important;
    max-height: none !important;
    height: auto !important;

/* ══════════════════════════════════════════
   SISTEMA SKEUOMORPHISM — Pastelería Confetti
   Cards, botones e inputs con profundidad física
   ══════════════════════════════════════════ */

/* Card elevada — papel grueso con sombra real */

.skeu-card {
  box-shadow:
    0 1px 0 rgba(255,255,255,0.85) inset,
    0 -1px 0 rgba(0,0,0,0.06) inset,
    0 4px 12px rgba(92,45,30,0.10),
    0 1px 3px rgba(92,45,30,0.06),
    0 0 0 1px rgba(240,221,213,0.8);
  background: linear-gradient(160deg, rgba(255,255,255,1) 0%, rgba(255,248,244,0.95) 100%);
  transition: box-shadow 0.2s ease, transform 0.15s ease;
}

.skeu-card:hover {
  box-shadow:
    0 1px 0 rgba(255,255,255,0.9) inset,
    0 -1px 0 rgba(0,0,0,0.06) inset,
    0 8px 24px rgba(92,45,30,0.14),
    0 2px 6px rgba(92,45,30,0.08),
    0 0 0 1px rgba(232,87,154,0.25);
  transform: translateY(-1px);
}

/* Card de producto — etiqueta de panadería */

.skeu-product {
  box-shadow:
    0 1px 0 rgba(255,255,255,0.9) inset,
    0 6px 16px rgba(92,45,30,0.12),
    0 2px 4px rgba(92,45,30,0.08),
    0 0 0 1px rgba(240,221,213,0.9);
  background: linear-gradient(150deg, #ffffff 0%, #fff8f4 60%, #fff3ee 100%);
}

.skeu-product:active {
  box-shadow:
    0 0 0 rgba(255,255,255,0.9) inset,
    0 2px 6px rgba(92,45,30,0.10),
    0 1px 2px rgba(92,45,30,0.06),
    0 0 0 1px rgba(232,87,154,0.3);
  transform: scale(0.97) translateY(1px);
}

/* Input grabado — hundido en la superficie.
   El truco: en claro, fondo ligeramente más oscuro que
   la card. En oscuro, fondo notablemente más claro que
   el contenedor para crear contraste real. */

.skeu-input {
  box-shadow:
    0 3px 8px rgba(0,0,0,0.13) inset,
    0 1px 0 rgba(255,255,255,1),
    0 0 0 1px rgba(200,160,140,0.4);
  background: rgba(245,234,228,0.55);
  transition: box-shadow 0.15s ease, background 0.15s ease;
}

.skeu-input:focus {
  box-shadow:
    0 4px 10px rgba(0,0,0,0.16) inset,
    0 1px 0 rgba(255,255,255,1),
    0 0 0 2px rgba(232,87,154,0.45);
  background: rgba(255,248,244,0.85);
  outline: none;
}

/* Textarea grabado — variante del input (no hereda focus de Input) */

.skeu-textarea {
  box-shadow:
    0 3px 8px rgba(0,0,0,0.13) inset,
    0 1px 0 rgba(255,255,255,1),
    0 0 0 1px rgba(200,160,140,0.4);
  background: rgba(245,234,228,0.55);
  transition: box-shadow 0.15s ease, background 0.15s ease;
  resize: vertical;
}

.skeu-textarea:focus {
  box-shadow:
    0 4px 10px rgba(0,0,0,0.16) inset,
    0 1px 0 rgba(255,255,255,1),
    0 0 0 2px rgba(232,87,154,0.45);
  background: rgba(255,248,244,0.85);
  outline: none;
}
