<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover para iOS notch; maximum-scale=1 evita zoom-out
         espontáneo al rotar/abrir teclado en algunos Android. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />

    <!-- Branding Confetti -->
    <title>Pastelería Confetti</title>
    <meta name="description" content="Punto de venta de Pastelería Confetti: ventas de mostrador, caja, pedidos de pastel, anticipos y cortes en las sucursales." />
    <meta name="application-name" content="Pastelería Confetti" />
    <meta name="theme-color" content="#E8579A" />

    <!-- App instalable en tablet/celular (Android Chrome usa el manifest) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512.png" />

    <!-- iPad / iPhone (Safari "Agregar a inicio" → app a pantalla completa) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Confetti POS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Pastelería Confetti" />
    <meta property="og:title" content="Pastelería Confetti" />
    <meta property="og:description" content="Punto de venta de Pastelería Confetti." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:image" content="/pwa-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
