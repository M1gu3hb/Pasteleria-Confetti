<!doctype html>
<html lang="es">
  <head>

    <meta name="application-name" content="MH Astral POS" />
    <meta name="apple-mobile-web-app-title" content="MH Astral POS" />
    <meta name="theme-color" content="#0a1428" />

    <meta property="og:title" content="MH Astral POS" />

    <meta property="og:url" content="https://pos-mh-astral-systems.com" />

    <meta property="og:image:secure_url" content="https://media.base44.com/images/public/69fbe8877069565e6f39775c/44176242f_1000129680.png" />

    <link rel="manifest" href="/manifest.json" />
